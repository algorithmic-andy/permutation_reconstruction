[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "permutation_reconstruction"
version = "0.1.0"
description = "Regression modeling of permutation reconstruction difficulty"
requires-python = ">=3.9.10"

dependencies = [
    "matplotlib",
    "numpy",
    "ortools",
    "pandas",
    "pickle",
    "pytest",
    "sklearn",
]

[tool.setuptools.packages.find]
where = ["."]
